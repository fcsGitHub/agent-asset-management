<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23246a55'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white'%3E%E5%B7%A5%3C/text%3E%3C/svg%3E" />
    <title>工作集 · Team Asset Workspace</title>
    <script>
      // 首帧前恢复主题，避免浅色闪烁；taw-theme ∈ light | dark |（缺省=跟随系统）
      try {
        var t = localStorage.getItem("taw-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
